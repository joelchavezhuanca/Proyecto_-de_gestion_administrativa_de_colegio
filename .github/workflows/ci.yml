name: Continuous Integration - Domingo Savio S.A.C.

on:
  push:
    branches: [ main, dev, 'feature/**', 'improvement/**', 'refactor/**', 'integration/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Ruff (Linteo + Formato) y Pytest (Unitarias, Integración, ATDD y Cobertura)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspección Estática de Código con Ruff
        run: ruff check .

      - name: Verificación de Formato con Ruff
        run: ruff format --check .

      - name: Pruebas de Aceptación ATDD (pytest-bdd · PBI-01 y PBI-10)
        run: pytest -v tests/acceptance

      - name: Ejecutar Pruebas Automatizadas y Cobertura ≥ 70 % (sin capa de presentación)
        run: >
          pytest -v
          --cov=src/dominio
          --cov=src/aplicacion
          --cov=src/infraestructura
          --cov-report=term-missing
          --cov-fail-under=70
